[project]
name = "l16-web-lab"
version = "0.3.0"
license = "MIT"
description = "Self-hosted webová náhrada Lumenu pro Light L16"
requires-python = ">=3.12"
dependencies = [
    "mizukage==0.1.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
    "click>=8.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "tifffile>=2024.1",
    "structlog>=24.1",
    "opencv-python-headless>=5.0.0.93",
]

[project.optional-dependencies]
demosaic = ["mizukage[demosaic]==0.1.0"]

[project.scripts]
l16 = "l16core.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["l16core", "app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["l16core"]
strict = true

[[tool.mypy.overrides]]
module = ["mizukage.*", "scipy.*", "tifffile.*", "colour_demosaicing.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
